# Development compose: PostgreSQL + FastAPI with hot reload.
#
# The frontend runs on the host (`cd frontend && bun install && bun run dev`);
# Vite proxies /api to http://localhost:8000. It is not containerized because
# a node_modules volume nested inside a ./frontend bind mount does not isolate
# anything on Docker Desktop for Mac: host and container installs overwrite
# each other's platform-specific binaries (e.g. @rollup/rollup-*).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: protocol
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/astral-sh/uv:python3.12-alpine
    working_dir: /app
    # Reload only on source changes: the host's backend/.venv is visible
    # under /app through the bind mount and must not trigger reloads.
    command: >-
      sh -c "uv sync && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir app --reload-dir migrations"
    volumes:
      - ./backend:/app
      # The venv lives outside the bind mount (a volume nested at /app/.venv
      # would be shared with the host's backend/.venv on Docker Desktop).
      - backend_venv:/venv
    ports:
      - "8000:8000"
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_PYTHON_DOWNLOADS: never # always build the venv on the image's Python
      UV_LINK_MODE: copy # uv's cache and /venv are on different filesystems
      APP_ENV: dev # allows the placeholder SECRET_KEY below
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/protocol
      APP_PASSWORD: devpassword
      SECRET_KEY: dev-secret-key-change-in-production
      ADMIN_NAME: Admin
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:8000"]'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  backend_venv:
